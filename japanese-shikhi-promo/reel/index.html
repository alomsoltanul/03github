<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Japanese Shikhi — Promo (reel 9:16)</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Roboto Condensed"; src: url("assets/fonts/roboto-condensed-700.woff2") format("woff2"); font-weight: 700; font-style: normal; }
      @font-face { font-family: "Noto Serif JP"; src: url("assets/fonts/noto-serif-jp-900-reel.woff2") format("woff2"); font-weight: 900; font-style: normal; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #07060c; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #07060c; }
      .layer { position: absolute; inset: 0; }
      /* the room: purple-lit curtain like the reference */
      .room { background:
          radial-gradient(ellipse 70% 38% at 50% 8%, rgba(126, 64, 220, 0.55) 0%, rgba(70, 30, 140, 0.25) 45%, rgba(7, 6, 12, 0) 100%),
          linear-gradient(180deg, #160d2b 0%, #0b0816 45%, #07060c 100%); }
      .curtain { background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.035) 0px, rgba(255, 255, 255, 0) 38px, rgba(0, 0, 0, 0.18) 70px, rgba(255, 255, 255, 0) 96px); opacity: 0.9; height: 1300px; }
      .desk { top: 1160px; background: linear-gradient(180deg, #120f1a 0%, #0a0910 60%, #050409 100%); }
      .spill { left: 40px; top: 1160px; width: 1000px; height: 420px; border-radius: 50%; background: radial-gradient(ellipse at 50% 30%, rgba(200, 190, 255, 0.16), rgba(0, 0, 0, 0) 70%); position: absolute; }
      #cam { position: absolute; inset: 0; }
      .lidwrap { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; perspective: 2200px; perspective-origin: 50% 40%; }
      .lid { position: absolute; left: 22px; top: 600px; width: 1036px; height: 628px; border-radius: 30px 30px 10px 10px; background: linear-gradient(180deg, #2a2a30, #17171c); padding: 18px 18px 26px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 120px rgba(170, 160, 255, 0.12); transform-origin: 50% 100%; }
      .display { position: relative; width: 1000px; height: 584px; border-radius: 10px; overflow: hidden; background: #000; }
      .menubar { position: absolute; left: 0; right: 0; top: 0; height: 22px; background: rgba(20, 20, 26, 0.92); display: flex; align-items: center; gap: 14px; padding: 0 14px; z-index: 2; }
      .menubar i { display: block; height: 7px; border-radius: 4px; background: rgba(255, 255, 255, 0.55); }
      .menubar .r { margin-left: auto; }
      #master { position: absolute; left: 0; top: 22px; width: 1000px; height: 562px; object-fit: cover; }
      .dock { position: absolute; left: 50%; bottom: 6px; display: flex; gap: 6px; padding: 6px 10px; border-radius: 14px; background: rgba(240, 240, 255, 0.28); z-index: 2; }
      .dock i { display: block; width: 26px; height: 26px; border-radius: 7px; }
      .deckwrap { position: absolute; left: 0; top: 1226px; width: 1080px; height: 700px; perspective: 1100px; perspective-origin: 50% 0%; }
      .deck { position: absolute; left: 10px; top: 0; width: 1060px; height: 820px; border-radius: 0 0 40px 40px; background: linear-gradient(180deg, #3a3a42 0%, #2a2a31 40%, #1d1d22 100%); transform-origin: 50% 0%; padding: 46px 110px 0; }
      .keys { display: grid; grid-template-columns: repeat(14, 1fr); gap: 9px; }
      .keys i { display: block; height: 44px; border-radius: 8px; background: #121216; box-shadow: 0 0 10px rgba(120, 95, 255, 0.55), inset 0 0 0 1px rgba(150, 130, 255, 0.35); }
      .keys i.w2 { grid-column: span 2; }
      .keys i.sp { grid-column: span 6; }
      .pad { margin: 40px auto 0; width: 460px; height: 290px; border-radius: 22px; background: linear-gradient(180deg, #34343c, #26262d); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06); }
      .caption { position: absolute; left: 0; right: 0; top: 380px; display: flex; align-items: center; justify-content: center; gap: 18px; color: #fff; font-family: "Roboto Condensed", sans-serif; font-weight: 700; font-size: 84px; letter-spacing: -0.01em; text-shadow: 0 3px 12px rgba(0, 0, 0, 0.55); }
      .hanko { width: 92px; height: 92px; border-radius: 26px; border: 4px solid #ffffff; background: #d42e3a; color: #ffffff; display: flex; align-items: center; justify-content: center; font-family: "Noto Serif JP", serif; font-weight: 900; font-size: 54px; text-shadow: none; }
      .vignette { background: radial-gradient(ellipse 80% 70% at 50% 50%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="reel" data-start="0" data-duration="53" data-width="1080" data-height="1920">
      <div class="layer room"></div>
      <div class="layer curtain"></div>
      <div class="layer desk"></div>
      <div class="spill"></div>

      <div id="cam">
        <div class="lidwrap">
          <div class="lid" id="lid">
            <div class="display">
              <div class="menubar"><i style="width:12px;border-radius:50%"></i><i style="width:46px"></i><i style="width:30px"></i><i style="width:36px"></i><i style="width:28px"></i><i class="r" style="width:22px"></i><i style="width:22px"></i><i style="width:64px"></i></div>
              <video id="master" class="clip" src="assets/master.mp4" muted playsinline data-start="0" data-duration="53" data-track-index="1"></video>
              <div class="dock" id="dock"></div>
            </div>
          </div>
        </div>
        <div class="deckwrap">
          <div class="deck" id="deck" data-layout-allow-overflow>
            <div class="keys" id="keys"></div>
            <div class="pad"></div>
          </div>
        </div>
      </div>

      <div class="caption" id="caption">Claude Cooked <span class="hanko">凄</span></div>
      <div class="layer vignette"></div>

      <audio id="reel-audio" src="assets/master-audio.wav" data-start="0" data-duration="53" data-track-index="2" data-volume="1"></audio>
    </div>

    <script>
      (function () {
        const dock = document.getElementById("dock");
        ["#3b82f6", "#22c55e", "#ef4444", "#f59e0b", "#a855f7", "#06b6d4", "#e63946", "#64748b", "#10b981", "#f97316", "#6366f1", "#eab308", "#ec4899", "#14b8a6", "#94a3b8"].forEach((c) => {
          const i = document.createElement("i");
          i.style.background = c;
          dock.appendChild(i);
        });
        const keys = document.getElementById("keys");
        const rows = [14, 14, 14, 13, 12, 9];
        rows.forEach((n, r) => {
          for (let k = 0; k < n; k++) {
            const i = document.createElement("i");
            if ((r === 3 && k === 0) || (r === 4 && (k === 0 || k === n - 1))) i.className = "w2";
            if (r === 5 && k === 4) i.className = "sp";
            keys.appendChild(i);
          }
        });

        const tl = gsap.timeline({ paused: true });
        tl.set("#dock", { xPercent: -50 }, 0);
        tl.set("#lid", { rotationX: 5 }, 0);
        tl.set("#deck", { rotationX: 70 }, 0);
        // handheld phone camera: three slow, unrelated sways (finite repeats only)
        const D = 53;
        tl.set("#cam", { x: -7, y: -6, rotation: -0.45, scale: 1 }, 0);
        const sway = (prop, amp, period) => {
          const reps = Math.max(0, Math.floor(D / period) - 1);
          tl.fromTo("#cam", { [prop]: -amp }, { [prop]: amp, duration: period, repeat: reps, yoyo: true, ease: "sine.inOut" }, 0);
        };
        sway("x", 7, 3.3);
        sway("y", 6, 2.45);
        sway("rotation", 0.45, 4.1);
        tl.fromTo("#cam", { scale: 1.0 }, { scale: 1.035, duration: D, ease: "none", transformOrigin: "50% 45%" }, 0);
        window.__timelines["reel"] = tl;
      })();
    </script>
  </body>
</html>
