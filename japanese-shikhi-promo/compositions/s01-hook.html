<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        [data-composition-id="s01"] .bg { background: radial-gradient(ellipse at 50% 45%, #f0505c 0%, var(--red) 55%, #c92a37 100%); }
        [data-composition-id="s01"] .stage { perspective: 1600px; }
        [data-composition-id="s01"] .title { position: absolute; left: 0; right: 0; top: 150px; text-align: center; color: #fff; font-size: 64px; font-weight: 800; letter-spacing: -0.02em; }
        [data-composition-id="s01"] .card {
          position: absolute; left: 560px; top: 290px; width: 800px; height: 500px; border-radius: 34px; background: #fff;
          box-shadow: 0 50px 120px rgba(90, 0, 12, 0.45); padding: 44px 52px; transform-style: preserve-3d;
        }
        [data-composition-id="s01"] .row { display: flex; align-items: center; justify-content: space-between; }
        [data-composition-id="s01"] .label { font-size: 26px; color: var(--muted); font-weight: 600; }
        [data-composition-id="s01"] .chip { font-size: 22px; font-weight: 700; color: var(--teal-deep); background: #e6f4f2; border-radius: 999px; padding: 8px 18px; }
        [data-composition-id="s01"] .num { margin-top: 14px; font-size: 112px; font-weight: 800; letter-spacing: -0.04em; color: var(--ink); line-height: 1; }
        [data-composition-id="s01"] .unit { font-size: 36px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 12px; }
        [data-composition-id="s01"] svg.chart { position: absolute; left: 52px; bottom: 96px; width: 696px; height: 170px; overflow: visible; }
        [data-composition-id="s01"] .chips { position: absolute; left: 52px; bottom: 34px; display: flex; gap: 12px; }
        [data-composition-id="s01"] .chips span { font-size: 20px; font-weight: 600; color: var(--ink); background: #f3eff0; border-radius: 10px; padding: 6px 14px; }
        [data-composition-id="s01"] .chips .k { font-family: var(--jp); font-weight: 900; color: var(--red); margin-right: 4px; }
      </style>

      <div id="root" data-composition-id="s01" data-width="1920" data-height="1080" data-duration="3">
        <div class="layer bg"></div>
        <div class="layer" id="s01-spheres"></div>
        <div class="title" id="s01-title">Your study app</div>
        <div class="layer stage">
          <div class="card" id="s01-card">
            <div class="row">
              <div class="label">Words learned</div>
              <div class="chip">+214 this week</div>
            </div>
            <div class="num"><span id="s01-num">0</span><span class="unit">words</span></div>
            <svg class="chart" viewBox="0 0 696 170">
              <defs>
                <linearGradient id="s01-fill" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#2a9d8f" stop-opacity="0.28" />
                  <stop offset="1" stop-color="#2a9d8f" stop-opacity="0" />
                </linearGradient>
              </defs>
              <path id="s01-area" d="M0 150 C 60 140, 100 138, 150 120 S 250 110, 300 92 S 400 96, 450 70 S 560 50, 610 30 L 696 14 L 696 170 L 0 170 Z" fill="url(#s01-fill)" />
              <path id="s01-line" d="M0 150 C 60 140, 100 138, 150 120 S 250 110, 300 92 S 400 96, 450 70 S 560 50, 610 30 L 696 14" fill="none" stroke="#2a9d8f" stroke-width="7" stroke-linecap="round" />
            </svg>
            <div class="chips">
              <span>N5</span>
              <span><b class="k">火</b>47-day streak</span>
              <span>Accuracy 96%</span>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const S = '[data-composition-id="s01"] ';
          const host = document.querySelector(S + "#s01-spheres");
          // Deterministic sphere field (seeded, no Math.random)
          const spheres = [
            [180, 210, 120, 0.9], [1610, 170, 150, 1], [1720, 760, 110, 0.8], [260, 820, 170, 1.1],
            [1450, 930, 70, 0.6], [470, 120, 60, 0.5], [1300, 120, 54, 0.5], [90, 520, 80, 0.7],
          ];
          spheres.forEach(([x, y, d, z], i) => {
            const el = document.createElement("div");
            el.className = "sphere";
            el.style.cssText = `left:${x}px;top:${y}px;width:${d}px;height:${d}px;` + (z < 0.7 ? "filter:blur(3px);" : "");
            el.dataset.z = z;
            host.appendChild(el);
          });

          gsap.registerPlugin(DrawSVGPlugin);
          const tl = gsap.timeline({ paused: true });
          const sph = gsap.utils.toArray(S + ".sphere");
          sph.forEach((el, i) => {
            const z = +el.dataset.z;
            tl.fromTo(el, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2)" }, 0.05 + i * 0.05);
            tl.fromTo(el, { x: 0, y: 0 }, { x: (i % 2 ? -1 : 1) * 60 * z, y: -50 * z, duration: 2.9, ease: "sine.inOut" }, 0.05);
          });

          tl.fromTo(S + "#s01-card", { rotationY: -26, rotationX: 16, scale: 0.72, y: 60, opacity: 0 },
            { rotationY: -14, rotationX: 9, scale: 0.92, y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0);
          tl.to(S + "#s01-card", { rotationY: -3, rotationX: 2, scale: 1.08, duration: 2.3, ease: "sine.inOut" }, 0.7);
          tl.fromTo(S + "#s01-title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.45);

          const counter = { v: 0 };
          const numEl = document.querySelector(S + "#s01-num");
          tl.fromTo(counter, { v: 0 }, {
            v: 1284, duration: 1.6, ease: "power2.out",
            onUpdate: () => { numEl.textContent = Math.round(counter.v).toLocaleString("en-US"); },
          }, 0.25);

          tl.fromTo(S + "#s01-line", { drawSVG: "0%" }, { drawSVG: "100%", duration: 1.6, ease: "power2.inOut" }, 0.5);
          tl.fromTo(S + "#s01-area", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "none" }, 1.0);
          tl.fromTo(S + ".chips span", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.08, ease: "power2.out" }, 1.3);

          window.__timelines["s01"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
