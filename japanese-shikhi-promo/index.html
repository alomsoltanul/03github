      /* Japanese Shikhi brand tokens (from japanese-shikhi/tailwind.config.ts + globals.css) */
      :root {
        --red: #e63946;
        --red-hi: #ff6b75;
        --red-deep: #b02330;
        --red-50: #fef2f3;
        --navy: #1d3557;
        --navy-deep: #0b1220;
        --sand: #f4a261;
        --sand-deep: #a4511a;
        --teal: #2a9d8f;
        --teal-deep: #1f7a6f;
        --pro: #6b21a8;
        --cream: #fbf8f3;
        --ink: #161320;
        --muted: #6b6574;
        --sans: "Inter", sans-serif;
        --serif: "DM Serif Display", serif;
        --jp: "Noto Serif JP", serif;
        --jp-sans: "Noto Sans JP", sans-serif;
        --bn: "Noto Sans Bengali", sans-serif;
        --mono: "JetBrains Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--cream); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: var(--sans); color: var(--ink); }
      [data-composition-id="main"] > div[data-composition-src] { position: absolute; inset: 0; }

      /* Shared building blocks used across scenes */
      .layer { position: absolute; inset: 0; }
      .center { display: flex; align-items: center; justify-content: center; }
      .serif { font-family: var(--serif); font-style: italic; font-weight: 400; }
      .kanji { font-family: var(--jp); font-weight: 900; line-height: 1; }
      .ball {
        position: absolute; border-radius: 50%;
        background: radial-gradient(circle at 34% 28%, #ff8a92 0%, var(--red) 42%, #b81f2c 100%);
        box-shadow: inset -18px -28px 60px rgba(110, 0, 12, 0.35), 0 34px 70px rgba(230, 57, 70, 0.32);
        display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff;
      }
      .sphere {
        position: absolute; border-radius: 50%;
        background: radial-gradient(circle at 34% 28%, #ffffff 0%, #f6eeee 45%, #d8c3c4 100%);
        box-shadow: inset -10px -14px 30px rgba(120, 60, 60, 0.18), 0 20px 40px rgba(80, 0, 10, 0.18);
      }
      .dot { position: absolute; border-radius: 50%; background: var(--red); }
      .eye { position: absolute; width: 40px; height: 48px; border-radius: 50%; background: #fff; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.12); }
      .eye::after { content: ""; position: absolute; width: 18px; height: 22px; border-radius: 50%; background: var(--ink); left: 12px; top: 14px; }
      .hanko {
        position: absolute; border: 9px solid var(--red); border-radius: 50%; color: var(--red);
        display: flex; align-items: center; justify-content: center; font-family: var(--jp); font-weight: 900;
        background: rgba(254, 242, 243, 0.85);
      }
      .pill { position: absolute; border-radius: 999px; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; white-space: nowrap; }
