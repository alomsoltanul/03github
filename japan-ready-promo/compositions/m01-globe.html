<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        [data-composition-id="m01"] .bg { background: radial-gradient(ellipse at 50% 45%, #13213a 0%, var(--night) 70%); }
        [data-composition-id="m01"] svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
        [data-composition-id="m01"] .star { position: absolute; border-radius: 50%; background: #fff; }
        [data-composition-id="m01"] .kicker { position: absolute; left: 120px; top: 110px; color: var(--teal-hi); font-size: 26px; font-weight: 600; letter-spacing: 0.32em; text-transform: uppercase; }
      </style>
      <div id="root" data-composition-id="m01" data-width="1920" data-height="1080" data-duration="6.35">
        <div class="layer bg"></div>
        <div class="layer" id="m01-stars"></div>
        <svg id="m01-svg" viewBox="0 0 1920 1080"></svg>
        <div class="pin" id="m01-dhaka" style="color: var(--teal-hi)"><div class="ring"></div><div class="dot" style="background: var(--teal)"></div><div class="lab">Dhaka<small>ঢাকা</small></div></div>
        <div class="pin" id="m01-tokyo" style="color: var(--red-hi)"><div class="ring"></div><div class="dot" style="background: var(--red)"></div><div class="lab">Tokyo<small class="ja">東京</small></div></div>
        <div class="kicker" id="m01-kicker">Bangladesh → Japan</div>
      </div>
      <script>
        (function () {
          const T0 = 0;
          const S = '[data-composition-id="m01"] ';
          const $ = (s) => document.querySelector(S + s);
          const r = JS.rng(41);
          const stars = $("#m01-stars");
          for (let i = 0; i < 70; i++) {
            const d = document.createElement("div");
            d.className = "star m01-star";
            const z = 1 + Math.floor(r() * 3);
            d.style.cssText = `left:${Math.floor(r() * 1920)}px;top:${Math.floor(r() * 1080)}px;width:${z}px;height:${z}px;opacity:${(0.2 + r() * 0.5).toFixed(2)}`;
            stars.appendChild(d);
          }
          const g = JS.globe($("#m01-svg"), { id: "m01g", cx: 960, cy: 500 });
          const st = { lon: 20, lat: 10, scale: 300, arc: 0, jp: 0.25 };
          const pins = [[$("#m01-dhaka"), JS.cities.dhaka], [$("#m01-tokyo"), JS.cities.tokyo]];
          const draw = () => {
            g.render(st);
            pins.forEach(([p, ll]) => {
              const xy = g.at(ll);
              if (xy) { p.style.left = xy[0] + "px"; p.style.top = xy[1] + "px"; p.style.visibility = "visible"; }
              else p.style.visibility = "hidden";
            });
          };
          const tl = gsap.timeline({ paused: true, onUpdate: draw });
          const L1 = JS.line("L01").start - T0;
          const wJapan = JS.word("L02", "Japan").s - T0;
          tl.set([$("#m01-dhaka"), $("#m01-tokyo")], { opacity: 0 }, 0);
          tl.fromTo($(".bg"), { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0);
          gsap.utils.toArray(S + ".m01-star").forEach((s, i) => tl.fromTo(s, { opacity: 0 }, { opacity: 0.6, duration: 0.8 + (i % 5) * 0.2, repeat: 2, yoyo: true, ease: "sine.inOut" }, (i % 9) * 0.1));
          // spin in and settle on Bangladesh
          tl.fromTo(st, { lon: 20, lat: 10, scale: 300 }, { lon: 90.4, lat: 23.8, scale: 470, duration: L1 + 0.6, ease: "power3.inOut" }, 0);
          tl.fromTo($("#m01-kicker"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5 }, 0.3);
          tl.fromTo($("#m01-dhaka"), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.5)" }, L1 + 0.05);
          tl.fromTo(S + "#m01-dhaka .ring", { scale: 1, opacity: 0.9 }, { scale: 4.5, opacity: 0, duration: 1.1, repeat: 2, ease: "power1.out" }, L1 + 0.1);
          // "Japan is next": turn east, light Japan, draw the route
          tl.to(st, { lon: 115, lat: 30, scale: 800, duration: 1.5, ease: "power2.inOut" }, wJapan - 0.9);
          tl.to(st, { jp: 1, duration: 0.4 }, wJapan);
          tl.to(st, { arc: 1, duration: 1.3, ease: "power1.inOut" }, wJapan - 0.3);
          tl.fromTo($("#m01-tokyo"), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.5)" }, wJapan + 0.95);
          tl.fromTo(S + "#m01-tokyo .ring", { scale: 1, opacity: 0.9 }, { scale: 4.5, opacity: 0, duration: 1.1, repeat: 0, ease: "power1.out" }, wJapan + 1.0);
          // hand-off: dive toward Japan
          tl.to(st, { lon: 137, lat: 36, scale: 1700, duration: 0.6, ease: "power2.in" }, 5.75);
          tl.to([$("#m01-dhaka"), $("#m01-tokyo"), $("#m01-kicker")], { opacity: 0, duration: 0.3 }, 5.8);
          draw();
          window.__timelines["m01"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
