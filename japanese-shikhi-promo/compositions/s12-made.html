      <script>
        (function () {
          const S = '[data-composition-id="s12"] ';
          const $ = (s) => S + s;
          const ball = (txt, d) => `<div style="width:${d}px;height:${d}px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#ff8a92,#e63946 45%,#b81f2c);display:flex;align-items:center;justify-content:center;color:#fff;font-size:${d / 3.4}px">${txt}</div>`;

          const frames = [
            ["#e63946", `<div style="width:200px;height:120px;border-radius:14px;background:#fff;color:#161320;font-size:40px;display:flex;align-items:center;justify-content:center">1,284</div>`],

            ["#fbf8f3", ball("412", 150)],
            ["#fbf8f3", `<div style="font-size:150px;color:#e63946">?</div>`],
            ["#fbf8f3", kan("忘", "#1d3557", "#fff", "46%")],
            ["#fbf8f3", kan("炎", "#f4a261", "#fff", "50% 50% 46% 46% / 62% 62% 38% 38%")],
            ["#0b1220", `<div style="width:130px;height:130px;border-radius:50%;background:#fbf8f3;display:flex;align-items:center;justify-content:center;color:#1d3557;font-size:40px">11:47</div>`],
            ["#0b1220", `<div style="font-size:64px;color:#fff;letter-spacing:-0.04em"><span style="color:#ff6b75">14</span> TABS</div>`],
            ["#fdfcfa", `<img src="assets/img/logo-trim.png" style="width:320px" alt="" />`],
            ["#fbf8f3", `<div style="padding:16px 34px;border-radius:60px;background:#e63946;color:#fff;font-size:64px">412</div>`],
            ["#fef2f3", kan("済", "rgba(254,242,243,.9)", "#e63946", "50%").replace("width:120px;height:120px", "width:120px;height:120px;border:8px solid #e63946")],
            ["#1d3557", kan("月", "#f4a261", "#1d3557", "50%")],
          ];
          const wall = document.querySelector($("#s12-wall"));
          frames.forEach(([bg, html]) => {
            const el = document.createElement("div");
            el.className = "fr s12-fr";
            el.style.background = bg;
            el.innerHTML = html;
            [el, ...el.querySelectorAll("*")].forEach((n) => n.setAttribute("data-layout-allow-overlap", ""));
            wall.appendChild(el);
          });

          const tl = gsap.timeline({ paused: true });
          tl.set([$("#s12-made"), $("#s12-ai"), $("#s12-every"), $("#s12-scrim")], { opacity: 0 }, 0);
          tl.set([$("#s12-wallbg"), $("#s12-wall3d")], { opacity: 0 }, 0);
          tl.set($("#s12-ed"), { opacity: 0 }, 0);

          // A — logo on white
          tl.fromTo($("#s12-logo"), { scale: 1.12, opacity: 0, filter: "blur(10px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 0);

          // B — the "screen" shrinks into the editor it was built in
          tl.set($("#s12-ed"), { opacity: 1 }, 0.8);
          tl.fromTo($("#s12-win"), { x: 0, y: 0, scale: 1, borderRadius: 0 }, { x: 680, y: 120, scale: 0.625, borderRadius: 28, transformOrigin: "0% 0%", duration: 0.6, ease: "power3.inOut" }, 0.8);
          tl.fromTo($("#s12-ask"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 1.15);
          tl.fromTo($("#s12-ph"), { x: 0 }, { x: 1700, duration: 4.0, ease: "none" }, 0.8);
          const typedEl = document.querySelector($("#s12-typed"));
          const full = typedEl.textContent;
          typedEl.textContent = "";
          const ty = { p: 0 };
          tl.fromTo(ty, { p: 0 }, { p: 1, duration: 0.9, ease: "none", onUpdate: () => (typedEl.textContent = full.slice(0, Math.round(ty.p * full.length))) }, 2.15);

          // C — Made with … AI.
          tl.fromTo($("#s12-made"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 1.6);
          tl.to($("#s12-logo"), { y: 60, duration: 0.35, ease: "power2.out" }, 1.6);
          tl.to($("#s12-logo"), { opacity: 0, scale: 0.7, filter: "blur(8px)", duration: 0.25, ease: "power2.in" }, 2.55);
          tl.fromTo($("#s12-ai"), { opacity: 0, scale: 1.5, rotation: -6 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.3, ease: "back.out(2)" }, 2.8);

          // D — Every single frame.
          tl.to([$("#s12-ed"), $("#s12-win")], { opacity: 0, duration: 0.3, ease: "power2.in" }, 3.3);
          tl.to($("#s12-wallbg"), { opacity: 1, duration: 0.2 }, 3.35);
          tl.set($("#s12-wall3d"), { opacity: 1 }, 3.35);
          tl.fromTo($("#s12-wall"), { rotationY: -38, rotationX: 16, z: -900, x: 500 }, { rotationY: -18, rotationX: 8, z: -200, x: -120, duration: 1.65, ease: "power2.out" }, 3.35);
          tl.fromTo($(".s12-fr"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, stagger: 0.03, ease: "back.out(1.8)" }, 3.35);
          tl.fromTo($("#s12-scrim"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 3.55);
          tl.fromTo($("#s12-every"), { opacity: 0, scale: 1.2 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 3.6);
