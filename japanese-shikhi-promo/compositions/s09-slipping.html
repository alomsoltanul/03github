      <div id="root" data-composition-id="s09" data-width="1920" data-height="1080" data-duration="5.4">
        <div class="layer bgA"></div>
        <div class="layer bgB" id="s09-bgB"></div>

        <div class="top" id="s09-t2">it taps you on the shoulder.</div>
        <div class="top" id="s09-t3">One tap.</div>

        <div class="layer" id="s09-A">
          <div class="rail"></div>
          <div class="card s09-card" style="left: 600px"><div class="kanji">食べる</div><small>たべる</small></div>
          <div class="card s09-card" style="left: 860px"><div class="kanji">学校</div><small>がっこう</small></div>
          <div class="card s09-card" style="left: 1120px"><div class="kanji">先生</div><small>せんせい</small></div>

          <div class="drop s09-drop" style="left: 943px; top: 560px"></div>

          <div>

        <svg class="check" viewBox="0 0 400 360" id="s09-checksvg"><path id="s09-check" d="M 40 190 L 150 300 L 370 50" fill="none" stroke="#e63946" stroke-width="54" stroke-linecap="round" stroke-linejoin="round" /></svg>
        <div class="hanko" id="s09-hanko">済</div>

      <script>
        (function () {
          gsap.registerPlugin(DrawSVGPlugin);
          const S = '[data-composition-id="s09"] ';
          const $ = (s) => S + s;
          const tl = gsap.timeline({ paused: true });
          tl.set([$("#s09-t2"), $("#s09-t3"), $("#s09-tap"), $("#s09-notif"), $("#s09-btn"), $("#s09-touch"), $("#s09-hanko"), $("#s09-done"), $("#s09-rip")], { opacity: 0 }, 0);
          tl.set($("#s09-check"), { drawSVG: "0%" }, 0);

          // A — words bleeding out of memory
          tl.fromTo($("#s09-t1"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.05);
          tl.fromTo($(".rail"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.05);
          tl.fromTo($(".s09-card"), { scaleY: 0 }, { scaleY: 1, duration: 0.45, stagger: 0.08, ease: "back.out(1.6)" }, 0.2);
          tl.to($(".s09-card"), { opacity: 0.45, scaleY: 0.82, duration: 1.4, stagger: 0.1, ease: "sine.in" }, 0.8);
          gsap.utils.toArray($(".s09-drop")).forEach((el, i) => {
            tl.fromTo(el, { y: -30, opacity: 0 }, { y: 280, opacity: 1, duration: 0.5, ease: "power2.in" }, 0.7 + i * 0.18);
            tl.fromTo(el, { y: -30 }, { y: 280, duration: 0.5, ease: "power2.in" }, 1.35 + i * 0.15);
          });
          tl.fromTo($("#s09-puddle"), { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power2.out" }, 1.1);
          tl.fromTo($("#s09-char"), { x: 600, rotation: 180 }, { x: 0, rotation: 0, duration: 0.55, ease: "power3.out" }, 1.35);

          // B — it taps you on the shoulder
          tl.to($("#s09-t1"), { opacity: 0, y: -20, duration: 0.25 }, 2.1);
          tl.to($("#s09-A"), { opacity: 0, y: 40, duration: 0.3, ease: "power2.in" }, 2.1);
          tl.to($("#s09-bgB"), { opacity: 1, duration: 0.3 }, 2.15);
          tl.fromTo($("#s09-t2"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 2.25);
          tl.to($("#s09-char"), { x: -120, y: -40, duration: 0.3, ease: "power2.inOut" }, 2.2);
          tl.to($("#s09-char"), { y: -80, duration: 0.12, yoyo: true, repeat: 3, ease: "power1.out" }, 2.45);
          tl.fromTo($("#s09-tap"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.2 }, 2.45);
          tl.fromTo($("#s09-rip"), { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.2, duration: 0.5, ease: "power2.out" }, 2.45);
          tl.fromTo($("#s09-notif"), { opacity: 0, y: -120, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 2.8);

          // C — One tap.
          tl.to([$("#s09-t2"), $("#s09-tap")], { opacity: 0, duration: 0.2 }, 3.5);
          tl.to($("#s09-notif"), { y: -160, opacity: 0, duration: 0.3, ease: "power2.in" }, 3.5);
          tl.to($("#s09-char"), { x: 400, opacity: 0, duration: 0.3, ease: "power2.in" }, 3.5);
          tl.fromTo($("#s09-t3"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 3.6);
          tl.fromTo($("#s09-btn"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 3.62);
          tl.fromTo($("#s09-touch"), { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" }, 3.85);
          tl.to($("#s09-btn"), { scale: 0.93, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.inOut" }, 3.95);

          // D — Reviewed. (済 = done)
          tl.to([$("#s09-btn"), $("#s09-touch"), $("#s09-t3")], { opacity: 0, scale: 0.9, duration: 0.2 }, 4.3);
          tl.set($("#s09-checksvg"), { opacity: 1 }, 4.35);
          tl.to($("#s09-check"), { drawSVG: "100%", duration: 0.35, ease: "power3.out" }, 4.4);
          tl.fromTo($("#s09-done"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 4.5);
          tl.fromTo($("#s09-hanko"), { opacity: 0, scale: 2.2, rotation: -30 }, { opacity: 1, scale: 1, rotation: -10, duration: 0.2, ease: "power4.in" }, 4.7);
          window.__timelines["s09"] = tl;
        })();
      </script>
    </template>
